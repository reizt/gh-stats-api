name = "gh-stats-api"

compatibility_date = "2026-07-23"
compatibility_flags = ["nodejs_compat"]

build.command = "bun run build"
main = "dist/index.js"
routes = [
  { pattern = "ghs.reiju.me", custom_domain = true }
]

observability.enabled = true

[observability.logs]
enabled = true

[triggers]
crons = ["0 0 * * *"]

[[r2_buckets]]
binding = "GITHUB_STATS"
bucket_name = "github-stats"
